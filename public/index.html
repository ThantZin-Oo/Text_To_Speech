<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <nav id="header">
      <a href="#" id="pdf_tab" class="active_tab header_item">PDF Upload</a>
      <a href="text_upload.html" id="text_tab" class="header_item"
        >Text Upload</a
      >
      <!-- <button id="recorded_tab" class="header_item" onclick="showPage('recorded_section')">Recorded</button> -->
    </nav>
    <hr />
    <div class="content">
      <div id="pdf_upload_section">
        <input type="text" name="" id="title" placeholder="Title For Voice.....">
        <div>
          <input type="file" name="pdf_input" id="pdf_upload" />
        </div>
      </div>
      <div>
        <button id="btn" onclick="generateVoice()" class="upload_btn">
          Upload
        </button>
      </div>
      <div>
        <audio id="player" controls style="margin-top: 10px"></audio>
        <a href="#" id="downloadMp3" class="upload_btn">Download</a>
      </div>
    </div>
  </body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script>
    document
      .getElementById("pdf_upload")
      .addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (file && file.type === "application/pdf") {
          const reader = new FileReader();
          reader.onload = function () {
            const typedArray = new Uint8Array(this.result);
            //       console.log(typedArray);
            pdfjsLib.getDocument(typedArray).promise.then(async function (pdf) {
              for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                console.log("this is the page" + page);
                const content = await page.getTextContent();
                console.log("This is content");
                const strings = content.items.map((item) => item.str).join(" ");
                fullText += strings + "\n";
              }
            });
          };
          reader.readAsArrayBuffer(file);
        } else {
          alert("Please upload a valid PDF file.");
        }
      });
  </script>
  <script src="main.js"></script>
</html>
